<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
             margin: 0;
              font-family: "Apple SD Gothic Neo", "Segoe UI", Arial, sans-serif;
             background-color: #f9fafb; /* ← 여기 */
             color: #333;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            padding: 40px;
        }

        .product-header {
            display: flex;
            gap: 40px;
        }

        .product-image {
            width: 320px;
            height: 320px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            flex: 1;
        }

        .product-info h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
        }

        .description {
            line-height: 1.7;
            color: #555;
            margin-bottom: 30px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px;
        }

        .feature-list li {
            margin-bottom: 10px;
            padding-left: 16px;
            position: relative;
        }

        .feature-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #888;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .actions button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .buy {
            background: #222;
            color: #fff;
        }

        .cart {
            background: #f0f0f0;
        }

        /* 하단 상세 설명 */
        .detail {
            margin-top: 50px;
            background: #fff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .detail h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .detail p {
            line-height: 1.8;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 상품 카드 -->
    <div class="product-card">
        <div class="product-header">
            <img
                class="product-image"
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                alt="product"
            >

            <div class="product-info">
                <h1>미니멀 워치</h1>
                <div class="price">₩129,000</div>

                <div class="description">
                    일상에 자연스럽게 어울리는 디자인과<br>
                    가벼운 착용감을 주는 워치입니다.
                </div>

                <ul class="feature-list">
                    <li>가벼운 착용감</li>
                    <li>최대 24시간 사용</li>
                    <li>노이즈 감소 기능</li>
                    <li>USB-C 고속 충전</li>
                </ul>

                <div class="actions">
                    <button class="buy">구매하기</button>
                    <button class="cart">장바구니</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상품 상세 설명 -->
    <div class="detail">
        <h2>상품 상세 정보</h2>
        <p>
            이 제품은 일상 속에서 편안하게 사용할 수 있도록 설계되었습니다.
            장시간 착용에도 부담이 없으며, 다양한 환경에서도 안정적인 성능을 제공합니다.
            심플한 디자인으로 어떤 스타일에도 잘 어울립니다.
        </p>
    </div>

</div>

</body>
</html>
